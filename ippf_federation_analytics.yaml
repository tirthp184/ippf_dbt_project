# ============================================================================
# CUSTOM INSTRUCTIONS
# ============================================================================

module_custom_instructions:

  sql_generation: |
    CRITICAL - avoid double counting pre-aggregated totals:
    When summing across service types, always add
    service_types.is_rollup_total = FALSE. When summing across contraceptive
    methods, always add contraceptive_methods.is_rollup_total = FALSE. These
    rollup rows are source-provided totals; including them double counts.

    CRITICAL - never combine the two budget tables in one figure:
    budget_by_focus_area and budget_by_expense_category split the SAME budget
    two independent ways. Answer budget questions from ONE of them, chosen by
    what the user asked about (programme area vs cost type). Never sum or union
    them together.

    CRITICAL - counting member associations:
    When counting MAs (e.g. "how many member associations in X"), always use
    COUNT(DISTINCT ma_uin), never COUNT(DISTINCT affiliate_name). The ma_uin
    column is the primary key and is never NULL. The affiliate_name column uses
    COALESCE and is also safe for display, but ma_uin is the canonical
    counting identifier.

    Geographic dimensions for budget/income vs service data:
    Budget and income data has no direct country link. Use
    member_associations.home_region_name for regional analysis of budget and
    income metrics. For SRH services, client reach, CYP, and humanitarian
    data, use regions.region_name (the direct geographic path via country_key).
    When a user asks about a specific country's budget (e.g. "Philippines budget"),
    filter by member_associations.home_country_name - this is the MA based in
    that country. Do NOT refuse or ask for clarification; the mapping from country
    to member association is automatic.

    Interpreting thematic filters in budget data:
    When a user asks about "youth" in a budget context, filter by
    focus_areas.is_youth_related = TRUE. When they ask about "advocacy",
    filter by focus_areas.is_advocacy = TRUE. These boolean flags exist to map
    natural language themes to budget focus areas. Always use them confidently -
    do not refuse or ask the user to clarify what "youth" means.

    Semi-additive measure: service_delivery_points counts facilities at a point
    in time. Do not sum it across multiple years; report the most recent year or
    state the year explicitly.

    Unknown members: dimension key value -1 and the label
    'Unknown / Unresolved' represent records whose dimension could not be
    resolved. Three countries (Cambodia, South Korea, Hong Kong) have no linked
    member association, so their DHIS service and CYP data appears against the
    Unknown member association. Mention this if a question asks for a complete
    breakdown by member association.

    Year coverage differs by subject area. Financial (budget, income) and
    humanitarian response data cover 2022-2025. SRH service delivery, CYP,
    client reach and training data cover 2024-2025 ONLY. If a user asks for a
    multi-year trend on service, CYP, client or training measures, state that
    only 2024 and 2025 are available.

    Known data gap: for SAR region in 2025 (and part of 2024 expense data),
    roughly 1,400 budget lines have no financial figures in the source and load
    as zero. When reporting SAR 2025 budget or actual figures, or when SAR
    appears as an outlier with very low or zero spend, state that this reflects
    incomplete source data rather than actual zero expenditure.

    Refugee and displaced populations: the source data has no direct
    refugee/IDP/host-community client-status field. Use
    disasters.displacement_context = TRUE as a proxy and describe results as
    "reach in displacement and conflict settings", never as verified refugee
    counts.

    Stock-outs: there is no commodity stock or stock-out data. If asked, explain
    that the available indicators are commodity budget execution rate
    (expense_categories.is_commodity = TRUE) and year-on-year change in
    contraceptive method availability by country.

    Format currency amounts with thousands separators and no decimal places.
    Format ratios and shares as percentages with one decimal place.

  question_categorization: |
    Questions about safeguarding investment or gender-equality investment in
    monetary terms cannot be answered directly - there is no budget tag for
    either. Explain that safeguarding is measurable as service volume
    (service_types.is_sgbv) and training effort
    (training_topics.is_safeguarding), and gender equality as service-delivery
    equity (humanitarian_services_by_gender), not as budgeted spend.

    Questions asking for facility-level or clinic-level locations, coordinates,
    or maps cannot be answered - the model holds only an aggregate count of
    service delivery points, with no facility names or coordinates.

    Questions asking for monthly or quarterly figures cannot be answered - all
    measures are annual grain. Say so and offer the annual figure instead.

    If a question about services, CYP, clients or training asks about a year
    before 2024, say that this data is only available from 2024 onward.

# ============================================================================
# VERIFIED QUERIES
# ============================================================================

verified_queries:

  - name: youth_budget_utilisation_by_country_year
    question: "What was the budget utilisation rate for youth in the Philippines in 2024 and 2025?"
    use_as_onboarding_question: false
    sql: |
      SELECT
        d.calendar_year,
        ma.affiliate_name,
        fa.focus_area_name,
        SUM(f.budget_amount) AS total_budget,
        SUM(f.actual_amount) AS total_actual,
        DIV0(SUM(f.actual_amount), NULLIF(SUM(f.budget_amount), 0)) AS budget_utilisation_rate
      FROM IPPF_EDW.SECURE.FACT_BUDGET_FOCUS_AREA f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_MEMBER_ASSOCIATION ma ON f.ma_key = ma.ma_key
      JOIN IPPF_EDW.EDW.DIM_COUNTRY c ON ma.home_country_key = c.country_key
      JOIN IPPF_EDW.EDW.DIM_FOCUS_AREA fa ON f.focus_area_key = fa.focus_area_key
      WHERE c.country_name_display = 'Philippines'
        AND fa.is_youth_related = TRUE
        AND d.calendar_year IN (2024, 2025)
      GROUP BY d.calendar_year, ma.affiliate_name, fa.focus_area_name
      ORDER BY d.calendar_year, fa.focus_area_name

  - name: total_services_by_region_year
    question: "How many SRH services were delivered by region in 2025?"
    use_as_onboarding_question: true
    sql: |
      SELECT
        g.region_name,
        SUM(f.service_count) AS services_delivered
      FROM IPPF_EDW.EDW.FACT_DHIS_SERVICE f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_COUNTRY c ON f.country_key = c.country_key
      JOIN IPPF_EDW.EDW.DIM_GEOGRAPHY g ON c.geography_key = g.geography_key
      JOIN IPPF_EDW.EDW.DIM_SERVICE_TYPE st ON f.service_type_key = st.service_type_key
      WHERE d.calendar_year = 2025
        AND st.is_total_rollup = FALSE
      GROUP BY g.region_name
      ORDER BY services_delivered DESC

  - name: budget_utilisation_by_ma
    question: "Which member associations underspent their budget the most in 2024?"
    use_as_onboarding_question: true
    sql: |
      SELECT
        ma.affiliate_name,
        ma.ma_uin,
        SUM(f.budget_amount) AS total_budget,
        SUM(f.actual_amount) AS total_actual,
        DIV0(SUM(f.actual_amount), NULLIF(SUM(f.budget_amount),0)) AS utilisation_rate
      FROM IPPF_EDW.EDW.FACT_BUDGET_FOCUS_AREA f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_MEMBER_ASSOCIATION ma ON f.ma_key = ma.ma_key
      WHERE d.calendar_year = 2024
      GROUP BY ma.affiliate_name, ma.ma_uin
      HAVING SUM(f.budget_amount) > 0
      ORDER BY utilisation_rate ASC
      LIMIT 10

  - name: cyp_by_method_category
    question: "What is the CYP breakdown by contraceptive method category?"
    sql: |
      SELECT
        d.calendar_year,
        m.method_category,
        SUM(f.cyp_value) AS cyp_achieved
      FROM IPPF_EDW.EDW.FACT_DHIS_CYP f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_CONTRACEPTIVE_METHOD m ON f.method_key = m.method_key
      WHERE m.is_total_rollup = FALSE
      GROUP BY d.calendar_year, m.method_category
      ORDER BY d.calendar_year, cyp_achieved DESC

  - name: youth_service_share_by_country
    question: "What percentage of services went to young people aged under 25, by country?"
    use_as_onboarding_question: true
    sql: |
      SELECT
        c.country_name_display,
        d.calendar_year,
        SUM(f.srh_sr_0_24) AS youth_services,
        SUM(f.srh_sr_total) AS total_services,
        DIV0(SUM(f.srh_sr_0_24), NULLIF(SUM(f.srh_sr_total),0)) AS youth_share
      FROM IPPF_EDW.EDW.FACT_CLIENT_PROFILE f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_COUNTRY c ON f.country_key = c.country_key
      GROUP BY c.country_name_display, d.calendar_year
      ORDER BY youth_share DESC

  - name: humanitarian_reach_in_displacement_settings
    question: "How many people did we reach in conflict and displacement settings?"
    use_as_onboarding_question: true
    sql: |
      SELECT
        d.calendar_year,
        g.region_name,
        dis.disaster_sub_category,
        SUM(r.actual_people_reached) AS people_reached
      FROM IPPF_EDW.EDW.FACT_HUM_RESPONSE r
      JOIN IPPF_EDW.EDW.DIM_DATE d ON r.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_COUNTRY c ON r.country_key = c.country_key
      JOIN IPPF_EDW.EDW.DIM_GEOGRAPHY g ON c.geography_key = g.geography_key
      JOIN IPPF_EDW.EDW.DIM_DISASTER dis ON r.disaster_key = dis.disaster_key
      WHERE dis.displacement_context = TRUE
      GROUP BY d.calendar_year, g.region_name, dis.disaster_sub_category
      ORDER BY people_reached DESC

  - name: cost_per_person_reached_by_funding
    question: "What was the cost per person reached by funding stream?"
    sql: |
      SELECT
        fu.funding_name,
        d.calendar_year,
        SUM(r.grant_usd) AS grant_usd,
        SUM(r.actual_people_reached) AS people_reached,
        DIV0(SUM(r.grant_usd), NULLIF(SUM(r.actual_people_reached),0)) AS cost_per_person
      FROM IPPF_EDW.EDW.FACT_HUM_RESPONSE r
      JOIN IPPF_EDW.EDW.DIM_DATE d ON r.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_FUNDING fu ON r.funding_key = fu.funding_key
      GROUP BY fu.funding_name, d.calendar_year
      ORDER BY d.calendar_year, cost_per_person

  - name: gender_equity_in_service_delivery
    question: "What is the gender breakdown of humanitarian services delivered?"
    sql: |
      SELECT
        d.calendar_year,
        g.gender,
        sm.service_mode,
        SUM(gs.service_count) AS services
      FROM IPPF_EDW.EDW.FACT_HUM_GENDER_SERVICE gs
      JOIN IPPF_EDW.EDW.DIM_DATE d ON gs.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_GENDER g ON gs.gender_key = g.gender_key
      JOIN IPPF_EDW.EDW.DIM_SERVICE_MODE sm ON gs.service_mode_key = sm.service_mode_key
      GROUP BY d.calendar_year, g.gender, sm.service_mode
      ORDER BY d.calendar_year, services DESC

  - name: self_sufficiency_by_ma
    question: "Which member associations are most financially self-sufficient?"
    sql: |
      SELECT
        ma.affiliate_name,
        d.calendar_year,
        SUM(f.locally_generated_income) AS local_income,
        SUM(COALESCE(f.ippf_income,0) + COALESCE(f.intl_income_non_ippf,0)
            + COALESCE(f.locally_generated_income,0)) AS total_income,
        DIV0(SUM(f.locally_generated_income),
             NULLIF(SUM(COALESCE(f.ippf_income,0) + COALESCE(f.intl_income_non_ippf,0)
                        + COALESCE(f.locally_generated_income,0)),0)) AS self_sufficiency_ratio
      FROM IPPF_EDW.EDW.FACT_MA_INCOME f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_MEMBER_ASSOCIATION ma ON f.ma_key = ma.ma_key
      GROUP BY ma.affiliate_name, d.calendar_year
      ORDER BY self_sufficiency_ratio DESC NULLS LAST

  - name: safeguarding_effort
    question: "How much safeguarding work did we do, in services and training?"
    sql: |
      SELECT
        d.calendar_year,
        g.region_name,
        SUM(hs.service_count) AS sgbv_services
      FROM IPPF_EDW.EDW.FACT_HUM_SERVICE hs
      JOIN IPPF_EDW.EDW.DIM_DATE d ON hs.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_COUNTRY c ON hs.country_key = c.country_key
      JOIN IPPF_EDW.EDW.DIM_GEOGRAPHY g ON c.geography_key = g.geography_key
      JOIN IPPF_EDW.EDW.DIM_SERVICE_TYPE st ON hs.service_type_key = st.service_type_key
      WHERE st.is_sgbv = TRUE
      GROUP BY d.calendar_year, g.region_name
      ORDER BY d.calendar_year, sgbv_services DESC

  - name: commodity_execution_rate
    question: "How well are member associations executing their commodity budgets?"
    sql: |
      SELECT
        ma.affiliate_name,
        d.calendar_year,
        SUM(f.budget_amount) AS commodity_budget,
        SUM(f.actual_amount) AS commodity_actual,
        DIV0(SUM(f.actual_amount), NULLIF(SUM(f.budget_amount),0)) AS execution_rate
      FROM IPPF_EDW.EDW.FACT_BUDGET_EXPENSE f
      JOIN IPPF_EDW.EDW.DIM_DATE d ON f.date_key = d.date_key
      JOIN IPPF_EDW.EDW.DIM_MEMBER_ASSOCIATION ma ON f.ma_key = ma.ma_key
      JOIN IPPF_EDW.EDW.DIM_EXPENSE_CATEGORY ec ON f.expense_category_key = ec.expense_category_key
      WHERE ec.is_commodity = TRUE
      GROUP BY ma.affiliate_name, d.calendar_year
      HAVING SUM(f.budget_amount) > 0
      ORDER BY execution_rate ASC
